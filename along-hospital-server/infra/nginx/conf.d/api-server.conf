# Redirect HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.shinjuuichi.me;

    return 301 https://$host$request_uri;
}

# HTTPS server for API Gateway
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.shinjuuichi.me;

    # Cloudflare Origin cert & key from cloudflare 
    ssl_certificate     /etc/nginx/certs/api.shinjuuichi.me.origin.crt;
    ssl_certificate_key /etc/nginx/certs/api.shinjuuichi.me.origin.key;

    ssl_trusted_certificate /etc/nginx/certs/cloudflare_origin_ca_rsa_root.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    ssl_stapling on;
    ssl_stapling_verify on;

    #Enable HSTS
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 25m;

    real_ip_header CF-Connecting-IP;

    # Proxy to API Gateway (supports WebSocket & SignalR)
    location / {
        proxy_pass http://api-gateway:8080;

        # Standard proxy headers
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        # WebSocket & SignalR support
        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;

        # Timeouts optimized for long-lived connections (SignalR/WebSocket)
        proxy_connect_timeout   60s;
        proxy_send_timeout      300s;
        proxy_read_timeout      300s;
        send_timeout            300s;

        # Buffer settings for real-time communication
        proxy_buffering off;
        proxy_cache off;
    }

    location = /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
