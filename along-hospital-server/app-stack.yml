x-worker-deploy: &worker-deploy
  mode: replicated
  replicas: 1
  placement:
    constraints:
      - node.role == worker
  restart_policy:
    condition: on-failure
    delay: 5s
    max_attempts: 10
    window: 120s
  update_config:
    parallelism: 1
    order: start-first
    failure_action: rollback
  rollback_config:
    parallelism: 1
    order: stop-first

x-aspnet-env: &aspnet-env
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
  ASPNETCORE_HTTP_PORTS: '8080'

x-jwt-env: &jwt-env
  JwtConfig__SecretKey: ${JWT_SECRET}
  JwtConfig__ExpireTimeInMinutes: ${JWT_EXPIRE_MINUTES}
  JwtConfig__Issuer: ${JWT_ISSUER}
  JwtConfig__Audience: ${JWT_AUDIENCE}

x-rabbitmq-env: &rabbitmq-env
  RabbitMQConfig__Host: ${RABBITMQ_HOST:-amqp://infra_rabbitmq:5672}
  RabbitMQConfig__UserName: ${RABBITMQ_USERNAME}
  RabbitMQConfig__Password: ${RABBITMQ_PASSWORD}

x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://observability_otel-collector:4317}
  OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}

x-redis-env: &redis-env
  RedisConfig__Host: ${REDIS_HOST:-infra_redis:6379}
  RedisConfig__InstanceName: ${REDIS_INSTANCE_NAME}
  RedisConfig__Password: ${REDIS_PASSWORD}

services:
  email-svc:
    image: ${DOCKER_REGISTRY:-docker.io}/${NAMESPACE_LC:-ok}/email-svc:${VERSION:-latest}
    ports:
      - target: 8080
        published: 7999
        protocol: tcp
        mode: ingress
    environment:
      <<: [*aspnet-env, *rabbitmq-env, *otel-env]
      EmailConfig__ApiKey: ${SENDGRID_API_KEY}
      EmailConfig__Email: ${EMAIL_ADDRESS}
      EmailConfig__DisplayName: ${EMAIL_DISPLAY_NAME}
      UrlsConfig__FrontendUrl: ${FRONTEND_URL}
    networks:
      - hospital-network
    deploy: *worker-deploy

  sms-svc:
