x-manager-observability-deploy: &manager-observability-deploy
  mode: replicated 
  replicas: 1
  placement:
    constraints:
      - node.role == manager
  restart_policy:
    condition: on-failure
    delay: 5s
    max_attempts: 10
    window: 120s
  update_config:
    parallelism: 1
    order: stop-first
    failure_action: rollback
  rollback_config:
    parallelism: 1
    order: stop-first

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.91.0
    command: ["--config=/etc/otel-collector-config.yml"]
    ports:
      - target: 4317
        published: 4317
        protocol: tcp
        mode: ingress
      - target: 4318
        published: 4318
        protocol: tcp
        mode: ingress
      - target: 8888
        published: 8888
        protocol: tcp
        mode: ingress
      - target: 9464
        published: 9464
        protocol: tcp
        mode: ingress
    volumes:
      - ${OBSERVABILITY_CONFIG_DIR:-/opt/along-hospital-server/infra/observability}/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - hospital-network
    deploy: *manager-observability-deploy

  loki:
    image: grafana/loki:2.9.3
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - target: 3100
        published: 3100
        protocol: tcp
        mode: ingress
    volumes:
      - ${OBSERVABILITY_CONFIG_DIR:-/opt/along-hospital-server/infra/observability}/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - hospital-network
    deploy: *manager-observability-deploy

  tempo:
    image: grafana/tempo:2.3.1
    command: -config.file=/etc/tempo/tempo-config.yml
    ports:
      - target: 3200
        published: 3200
        protocol: tcp
        mode: ingress
    volumes:
      - ${OBSERVABILITY_CONFIG_DIR:-/opt/along-hospital-server/infra/observability}/tempo-config.yml:/etc/tempo/tempo-config.yml:ro
      - tempo_data:/var/tempo
    networks:
      - hospital-network
    deploy: *manager-observability-deploy

  node-exporter:
    image: prom/node-exporter:v1.7.0
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    ports:
      - target: 9100
        published: 9100
        protocol: tcp
        mode: ingress
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    networks:
      - hospital-network
    deploy: *manager-observability-deploy

  prometheus:
    image: prom/prometheus:v2.48.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
    ports:
      - target: 9090
        published: 9090
        protocol: tcp
        mode: ingress
    volumes:
      - ${OBSERVABILITY_CONFIG_DIR:-/opt/along-hospital-server/infra/observability}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${OBSERVABILITY_CONFIG_DIR:-/opt/along-hospital-server/infra/observability}/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    networks:
      - hospital-network
    deploy: *manager-observability-deploy

  grafana:
    image: grafana/grafana:10.2.3
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
        mode: ingress
    volumes:
      - ${OBSERVABILITY_CONFIG_DIR:-/opt/along-hospital-server/infra/observability}/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${OBSERVABILITY_CONFIG_DIR:-/opt/along-hospital-server/infra/observability}/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - hospital-network
    deploy: *manager-observability-deploy

volumes:
  loki_data:
  tempo_data:
  prometheus_data:
  grafana_data:

networks:
  hospital-network:
    external: true
