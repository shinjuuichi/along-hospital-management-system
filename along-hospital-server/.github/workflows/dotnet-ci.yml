name: .NET CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  build-and-test:
    name: Build & Test .NET
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore along-hospital-server.sln

      - name: Build
        run: dotnet build along-hospital-server.sln --no-restore

      - name: Test
        run: dotnet test along-hospital-server.sln --no-build --verbosity normal